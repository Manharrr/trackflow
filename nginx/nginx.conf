import axios from 'axios';

// Production Django API
const apiBaseUrl =
  import.meta.env.VITE_API_BASE_URL || 'https://api.manhargurukkal.site';

/**
 * Sends a chat message through the Django backend.
 *
 * Flow:
 * React Frontend
 *      ↓
 * Django /api/chatbot/
 *      ↓
 * FastAPI AI Service
 *
 * Do NOT call the FastAPI service directly from the browser.
 *
 * @param {Object} params
 * @param {string} params.question - Current user question
 * @param {number|null} params.tenantId - Tenant ID or null
 * @param {Array} params.history - Previous conversation history
 * @param {boolean} params.isPublic - Whether the chatbot is public
 * @param {AbortSignal} [params.signal] - Abort controller signal
 *
 * @returns {Promise<{
 *   answer: string,
 *   retrievedContext: string
 * }>}
 */
export const sendChatMessage = async ({
  question,
  tenantId,
  history,
  isPublic,
  signal,
}) => {
  try {
    const response = await axios.post(
      `${apiBaseUrl}/api/chatbot/`,
      {
        question,
        tenant_id: tenantId ?? null,
        history: history ?? [],
        is_public: !!isPublic,
      },
      {
        timeout: 20000,
        signal,
        headers: {
          'Content-Type': 'application/json',
        },
      }
    );

    const data = response.data;

    if (!data || typeof data.answer !== 'string') {
      throw new Error(
        'Malformed response: answer field is missing or invalid.'
      );
    }

    return {
      answer: data.answer,
      retrievedContext: data.retrieved_context ?? '',
    };
  } catch (error) {
    // Request cancelled
    if (axios.isCancel(error)) {
      throw {
        type: 'CANCEL',
        message: 'Request was cancelled.',
      };
    }

    // Timeout
    if (
      error.code === 'ECONNABORTED' ||
      error.message?.includes('timeout')
    ) {
      throw {
        type: 'TIMEOUT',
        message:
          'The AI is taking too long to respond. Please try again.',
      };
    }

    // Network error
    if (!error.response) {
      throw {
        type: 'NETWORK',
        message: 'Something went wrong, please try again.',
      };
    }

    // HTTP error
    throw {
      type: 'HTTP',
      status: error.response.status,
      message: 'Something went wrong, please try again.',
    };
  }
};
