name: TrackFlow CI

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

jobs:

  backend-ci:
    name: Backend CI
    runs-on: ubuntu-latest

    env:
      SECRET_KEY: "ci-only-secret-key-do-not-use-in-production"

    steps:

      # 1. Get the repository code
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Set up Python
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # 3. Install backend dependencies
      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      # 4. Check Django configuration
      - name: Django system check
        run: |
          python backend/manage.py check

      # 5. Check for missing migrations
      - name: Check migrations
        run: |
          python backend/manage.py makemigrations --check --dry-run

      # 6. Run Django tests
      - name: Run backend tests
        run: |
          python backend/manage.py test

      # 7. Build backend Docker image
      - name: Build backend Docker image
        run: |
          docker build -t trackflow-backend ./backend


  ai-service-ci:
    name: AI Service CI
    runs-on: ubuntu-latest

    steps:

      # 1. Get the repository code
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Build AI service Docker image
      - name: Build AI service Docker image
        run: |
          docker build -t trackflow-ai ./ai_service


  push-to-ecr:
    name: Push Docker Images to ECR
    runs-on: ubuntu-latest

    # Only push images for direct pushes to main.
    # Pull requests will run CI but will NOT push images to ECR.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    # ECR push starts only after both CI jobs succeed.
    needs:
      - backend-ci
      - ai-service-ci

    permissions:
      id-token: write
      contents: read

    steps:

      # 1. Get the repository code
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Debug OIDC claims
        env:
          ACTIONS_ID_TOKEN_REQUEST_URL: ${{ env.ACTIONS_ID_TOKEN_REQUEST_URL }}
          ACTIONS_ID_TOKEN_REQUEST_TOKEN: ${{ env.ACTIONS_ID_TOKEN_REQUEST_TOKEN }}
        run: |
          TOKEN=$(curl -s \
            -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=sts.amazonaws.com" \
            | python -c "import sys,json; print(json.load(sys.stdin)['value'])")

          echo "$TOKEN" | cut -d '.' -f2 | base64 -d 2>/dev/null | jq '{sub, aud}'

      # 2. Configure AWS using GitHub OIDC
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::422766738120:role/TrackFlow-GitHubActions-ECR
          aws-region: eu-north-1

      # 3. Login to Amazon ECR
      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      # 4. Build backend Docker image
      - name: Build backend Docker image
        run: |
          docker build \
            -t 422766738120.dkr.ecr.eu-north-1.amazonaws.com/trackflow-backend:latest \
            ./backend

      # 5. Build AI service Docker image
      - name: Build AI service Docker image
        run: |
          docker build \
            -t 422766738120.dkr.ecr.eu-north-1.amazonaws.com/trackflow-ai:latest \
            ./ai_service

      # 6. Push backend image to ECR
      - name: Push backend image to ECR
        run: |
          docker push \
            422766738120.dkr.ecr.eu-north-1.amazonaws.com/trackflow-backend:latest

      # 7. Push AI image to ECR
      - name: Push AI image to ECR
        run: |
          docker push \
            422766738120.dkr.ecr.eu-north-1.amazonaws.com/trackflow-ai:latest

  deploy-to-ec2:
    name: Deploy to EC2
    runs-on: ubuntu-latest

    # Deploy only after ECR push succeeds
    needs:
      - push-to-ecr

    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:

      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            cd ~/trackflow

            echo "Pulling latest Docker images..."
            docker compose pull backend celery_worker celery_beat ai_service

            echo "Restarting updated services..."
            docker compose up -d --force-recreate backend celery_worker celery_beat ai_service

            echo "Checking running containers..."
            docker compose ps