name: TrackFlow CI

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

jobs:

  backend-ci:
    name: Backend CI
    runs-on: ubuntu-latest

    env:
      SECRET_KEY: "ci-only-secret-key-do-not-use-in-production"

    steps:

      # 1. Get the repository code
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Set up Python
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # 3. Install backend dependencies
      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      # 4. Check Django configuration
      - name: Django system check
        run: |
          python backend/manage.py check

      # 5. Check for missing migrations
      - name: Check migrations
        run: |
          python backend/manage.py makemigrations --check --dry-run

      # 6. Run Django tests
      - name: Run backend tests
        run: |
          python backend/manage.py test

      # 7. Build backend Docker image
      - name: Build backend Docker image
        run: |
          docker build -t trackflow-backend ./backend


  ai-service-ci:
    name: AI Service CI
    runs-on: ubuntu-latest

    steps:

      # 1. Get the repository code
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Build AI service Docker image
      - name: Build AI service Docker image
        run: |
          docker build -t trackflow-ai ./ai_service


  push-to-ecr:
    name: Push Docker Images to ECR
    runs-on: ubuntu-latest

    # Only push images for direct pushes to main.
    # Pull requests will run CI but will NOT push images to ECR.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    # ECR push starts only after both CI jobs succeed.
    needs:
      - backend-ci
      - ai-service-ci

    permissions:
      id-token: write
      contents: read

    steps:

      # 1. Get the repository code
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Debug GitHub OIDC claims
        uses: github/actions-oidc-debugger@main
        with:
          audience: sts.amazonaws.com

      # 2. Configure AWS using GitHub OIDC
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::422766738120:role/TrackFlow-GitHubActions-ECR
          aws-region: eu-north-1

      # 3. Login to Amazon ECR
      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      # 4. Build backend Docker image
      - name: Build backend Docker image
        run: |
          docker build \
            -t 422766738120.dkr.ecr.eu-north-1.amazonaws.com/trackflow-backend:latest \
            ./backend

      # 5. Build AI service Docker image
      - name: Build AI service Docker image
        run: |
          docker build \
            -t 422766738120.dkr.ecr.eu-north-1.amazonaws.com/trackflow-ai:latest \
            ./ai_service

      # 6. Push backend image to ECR
      - name: Push backend image to ECR
        run: |
          docker push \
            422766738120.dkr.ecr.eu-north-1.amazonaws.com/trackflow-backend:latest

      # 7. Push AI image to ECR
      - name: Push AI image to ECR
        run: |
          docker push \
            422766738120.dkr.ecr.eu-north-1.amazonaws.com/trackflow-ai:latest